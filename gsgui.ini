# Turbo Algorithm Options:
# - ratio_low: Choisir le ratio le plus faible
# - ratio_high: Choisir le ratio le plus élevé  
# - votes_high: Choisir le plus de votes
# - rank_best: Choisir le meilleur rang (plus petit nombre)
# - efficiency: Choisir le meilleur ratio votes/rang
# - hybrid: Stratégie hybride avec filtres (recommandé)
# - random: Choix aléatoire
# - bruno_custom: Algorithme spécial Bruno (évite ratio 1.5 et < 1)

# Auto-optimisation Turbo:
# - auto_optimize_turbo: true/false (défaut: true)
# - L'algorithme s'optimise automatiquement après chaque turbo
# - Change vers l'algorithme avec le meilleur taux de succès
# - Minimum 15 comparaisons et 5% d'amélioration requis

# Historique Turbo:
# L'historique des comparaisons turbo est automatiquement sauvegardé dans [turbo_history]
# Données sauvegardées pour chaque comparaison:
# - timestamp, challenge_id, challenge_title, time_left
# - algorithm utilisé, strategy_description, success/échec
# - photo1: id, ratio, votes, rank, found (trouvée dans classement)
# - photo2: id, ratio, votes, rank, found (trouvée dans classement)  
# - winner: id, is_photo1 (vraie si photo1 gagnante)

