version: '3.8'

services:
  # Backend API (file-based persistence)
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app:ro  # Mount source pour développement
      - ./data:/app/data   # Persistance des fichiers .ini
    restart: unless-stopped
    
  # Redis Cache (optionnel pour les sessions WebSocket)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data: